# TEMPORÁRIO: roda uma vez a cópia Aiven (MySQL) -> Neon (PostgreSQL) e é
# removido no commit seguinte, antes do merge da PR #51.
name: Copiar dados Aiven para Neon (uso único)

on:
  push:
    branches: [claude/project-thread-8zeflo]
    paths: [".github/workflows/copiar-dados-aiven.yml"]

permissions:
  contents: read

concurrency:
  group: copiar-dados-aiven
  cancel-in-progress: false

jobs:
  copiar:
    if: startsWith(github.event.head_commit.message, '[copiar-dados]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BackEnd/Python
    env:
      APP_ENV: test
      ORIGEM_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      DESTINO_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Conferir segredos
        run: |
          [ -n "$ORIGEM_DATABASE_URL" ] || { echo "::error::Falta o segredo AIVEN_DATABASE_URL"; exit 1; }
          [ -n "$DESTINO_DATABASE_URL" ] || { echo "::error::Falta o segredo NEON_DATABASE_URL"; exit 1; }
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Criar as tabelas no Neon (alembic upgrade head)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: alembic upgrade head
      - name: Conferir origem e destino
        run: |
          set -o pipefail
          python scripts/copiar_mysql_para_postgres.py --sem-detalhes 2>&1 | tee conferencia.txt
          echo "::notice title=Conferência::$(tr '\n' ' ' < conferencia.txt)"
      - name: Copiar
        run: |
          set -o pipefail
          python scripts/copiar_mysql_para_postgres.py --sem-detalhes --executar 2>&1 | tee copia.txt
          echo "::notice title=Cópia::$(tail -n 1 copia.txt)"
      - name: Registrar falha
        if: failure()
        run: |
          for f in conferencia.txt copia.txt; do [ -f "$f" ] && echo "::error title=$f::$(grep -E 'ERRO|Error|rror:' "$f" | head -n 3 | tr '\n' ' ')"; done; true
