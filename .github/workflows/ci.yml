name: ChurrasPlan CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit/integration (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd/Python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BackEnd/Python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: pytest -q tests
      - name: ORM x schema.sql parity
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: python ../../scripts/validate_schema.py

  mysql-real:
    name: MySQL 8 real + Alembic
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: churrasplan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: BackEnd/Python
    env:
      DATABASE_URL: mysql+pymysql://root:root_ci@127.0.0.1:3306/churrasplan_test?charset=utf8mb4
      MYSQL_TEST_URL: mysql+pymysql://root:root_ci@127.0.0.1:3306/churrasplan_test?charset=utf8mb4
      APP_ENV: test
      REQUIRE_EMAIL_VERIFICATION: "false"
      COOKIE_SECURE: "false"
      SECURITY_PEPPER: mysql-ci-pepper-012345678901234567890123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BackEnd/Python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q tests_mysql

  frontend-static:
    name: Frontend static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: find FrontEnd/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Service worker syntax
        run: node --check FrontEnd/sw.js
      - name: Basic local references
        run: python scripts/validate_frontend.py


  security-static:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BackEnd/Python/requirements.txt
      - run: pip install -r BackEnd/Python/requirements.txt pip-audit bandit
      - name: Dependency vulnerabilities
        run: pip-audit -r BackEnd/Python/requirements.txt
      - name: Static Python security scan
        run: bandit -q -r BackEnd/Python -x BackEnd/Python/tests,BackEnd/Python/tests_mysql -lll

  docker-build:
    name: Docker configuration and images
    runs-on: ubuntu-latest
    env:
      APP_DOMAIN: churrasplan.example.com
      TLS_EMAIL: devnull@example.com
      MYSQL_PASSWORD: ci-mysql-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      SECURITY_PEPPER: ci-security-pepper-012345678901234567890123456789
      SMTP_HOST: smtp.example.com
      SMTP_FROM: ChurrasPlan <no-reply@example.com>
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.dev.yml config >/dev/null
          docker compose -f docker-compose.production.yml config >/dev/null
      - name: Build backend image
        run: docker build -t churrasplan-backend-ci BackEnd/Python
      - name: Build frontend image
        run: docker build -t churrasplan-frontend-ci FrontEnd

  e2e:
    name: E2E Chromium + MySQL
    runs-on: ubuntu-latest
    needs: [backend-unit, mysql-real, frontend-static, security-static, docker-build]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_e2e
          MYSQL_DATABASE: churrasplan_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_e2e --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://root:root_e2e@127.0.0.1:3306/churrasplan_e2e?charset=utf8mb4
      APP_ENV: test
      REQUIRE_EMAIL_VERIFICATION: "false"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:5500
      PUBLIC_APP_URL: http://127.0.0.1:5500
      SECURITY_PEPPER: e2e-pepper-012345678901234567890123456789012
      E2E_BASE_URL: http://127.0.0.1:5500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BackEnd/Python/requirements-dev.txt
      - run: pip install -r BackEnd/Python/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Migrate database
        working-directory: BackEnd/Python
        run: |
          alembic upgrade head
          python scripts/seed_demo.py
      - name: Start API and frontend
        run: |
          (cd BackEnd/Python && uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/churrasplan-api.log 2>&1 & echo $! > /tmp/churrasplan-api.pid)
          (python -m http.server 5500 --bind 127.0.0.1 --directory FrontEnd > /tmp/churrasplan-web.log 2>&1 & echo $! > /tmp/churrasplan-web.pid)
          python scripts/wait_http.py http://127.0.0.1:8000/api/health http://127.0.0.1:5500/index.html
      - name: Run browser flows
        run: pytest -q e2e
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/churrasplan-api.log
            /tmp/churrasplan-web.log
