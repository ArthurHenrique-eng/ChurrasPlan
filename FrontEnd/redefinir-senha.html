<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#a62210">
<meta name="robots" content="noindex,nofollow">
<title>Redefinir senha — ChurrasPlan</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/pwa/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" href="fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/ds.css">
<link rel="stylesheet" href="css/pages/account.css">
</head>
<body class="auth-page" data-auth-page="redefinir">
<a class="skip-link" href="#main">Pular para o conteúdo</a>
<header class="auth-topbar">
  <div class="auth-topbar__inner">
    <a class="brand-lockup" href="index.html" aria-label="ChurrasPlan, página inicial">
      <img class="brand-lockup__icon" src="assets/logo-icon-96.webp" alt="" width="38" height="36">
      <img class="brand-lockup__wordmark" src="assets/logo-wordmark-320.webp" alt="ChurrasPlan" width="132" height="20">
    </a>
    <a class="text-button" href="login.html">Voltar ao login</a>
  </div>
</header>
<main id="main" class="auth-main">
  <div class="auth-layout auth-layout--single">
    <section class="auth-copy">
      <h1>Escolha uma senha nova.</h1>
      <p>Use pelo menos 10 caracteres e não reutilize senhas de outros serviços.</p>
    </section>
    <section class="auth-card" aria-labelledby="auth-titulo">
      <h2 id="auth-titulo">Redefinir senha</h2>
      <form class="auth-form" id="auth-form">
        <div class="campo"><label for="auth-senha">Nova senha</label><input autocomplete="new-password" id="auth-senha" maxlength="128" minlength="10" required type="password"></div>
        <div class="campo"><label for="auth-senha2">Confirmar nova senha</label><input autocomplete="new-password" id="auth-senha2" maxlength="128" minlength="10" required type="password"></div>
        <button class="btn btn--primary btn--lg btn--block" type="submit">Salvar nova senha</button>
      </form>
      <div class="mensagem auth-message" id="auth-message" style="display:none"></div>
    </section>
  </div>
</main>
<footer class="app-footer-mini">
  <span>© 2026 ChurrasPlan</span>
  <nav aria-label="Links legais"><a href="privacidade.html">Privacidade</a><a href="termos.html">Termos</a><a href="cookies.html">Cookies</a></nav>
</footer>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/script.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/auth-pages.js"></script>
<script src="js/pwa.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
